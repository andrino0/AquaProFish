name: Build AquaProFish APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Build web app for Android
        run: npm run build:android
      - name: Prepare official AquaProFish icon and splash
        run: |
          npm install --no-save sharp @capacitor/assets
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          const logo = Buffer.from(await (await import('node:fs/promises')).readFile('public/aquaprofish-logo.svg'));
          await sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#071a2b' } })
            .composite([{ input: await sharp(logo).resize(820, 692, { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
            .png().toFile('assets/icon-only.png');
          await sharp({ create: { width: 2732, height: 2732, channels: 4, background: '#071a2b' } })
            .composite([{ input: await sharp(logo).resize(1900, 1603, { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
            .png().toFile('assets/splash.png');
          NODE
          npx capacitor-assets generate --android
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaProFish-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APK download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AquaProFish.apk
      - name: Publish latest test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AquaProFish - APK mais recente
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AquaProFish.apk
