name: Build AquaProFish APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Build web app for Android
        run: npm run build:android
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Android SDK versions
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\135/' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(compileSdk[[:space:]]+)[0-9]+/\135/' android/app/build.gradle
          fi
          echo "Android compile SDK configuration:"
          grep -R -n -E 'compileSdk(Version)?[[:space:]]*[= ]' android/variables.gradle android/app/build.gradle || true
          if [ -f android/variables.gradle ]; then
            sed -i -E 's/(minSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\123/' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(minSdk[[:space:]]+)[0-9]+/\123/' android/app/build.gradle
          fi
          echo "Android minimum SDK configuration:"
          grep -R -n -E 'minSdk(Version)?[[:space:]]*[= ]' android/variables.gradle android/app/build.gradle || true

      - name: Prepare official AquaProFish icon and splash
        run: |
          npm install --no-save sharp @capacitor/assets
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          const logo = Buffer.from(await (await import('node:fs/promises')).readFile('public/aquaprofish-logo.svg'));
          const appIcon = await sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#071a2b' } })
            .composite([{ input: await sharp(logo).resize(820, 692, { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
            .png().toBuffer();
          await sharp(appIcon).png().toFile('assets/icon.png');
          await sharp(appIcon).png().toFile('assets/icon-only.png');
          await sharp({ create: { width: 2732, height: 2732, channels: 4, background: '#071a2b' } })
            .composite([{ input: await sharp(logo).resize(1900, 1603, { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
            .png().toFile('assets/splash.png');
          NODE
          npx capacitor-assets generate --android

      - name: Set Android app version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Sync Android project
        run: npx cap sync android
      - name: Apply the same PNG launcher icon method as DinheiroFacil
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          const logo = Buffer.from(await fs.readFile('public/aquaprofish-logo.svg'));
          const root = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(sizes)) {
            const dir = `${root}/mipmap-${density}`;
            await fs.mkdir(dir, { recursive: true });
            const icon = await sharp({ create: { width: size, height: size, channels: 4, background: '#071a2b' } })
              .composite([{ input: await sharp(logo).resize(Math.round(size * 0.88), Math.round(size * 0.74), { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
              .png().toBuffer();
            await fs.writeFile(`${dir}/ic_launcher.png`, icon);
            await fs.writeFile(`${dir}/ic_launcher_round.png`, icon);
          }
          const adaptiveDir = `${root}/mipmap-anydpi-v26`;
          await fs.rm(`${adaptiveDir}/ic_launcher.xml`, { force: true });
          await fs.rm(`${adaptiveDir}/ic_launcher_round.xml`, { force: true });
          console.log('PNG launcher icons written for all Android densities; adaptive XML icons removed.');
          NODE
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aquaprofish-android-debug-signing-key-v1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaProFish-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APK download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AquaProFish.apk
      - name: Publish latest test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AquaProFish - APK mais recente
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AquaProFish.apk