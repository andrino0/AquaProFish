name: Atualizar imagens Guppy e Betta

on:
  push:
    branches: ["main"]
    paths:
      - ".github/image-upload/trigger.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aquaprofish-fish-images
  cancel-in-progress: false

jobs:
  replace-fish-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do AquaProFish
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar e validar as imagens recebidas
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ".github/image-upload/trigger.json" ]; then
            echo "Nenhum pacote de imagens pendente; nada a fazer."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const payload = JSON.parse(fs.readFileSync('.github/image-upload/trigger.json', 'utf8'));
          const dir = '.github/image-upload';
          function download(url, file, label) {
            if (typeof url !== 'string' || !url.startsWith('https://d2jqrm6oza8nb6.cloudfront.net/')) {
              throw new Error('Endereço inválido para a imagem ' + label);
            }
            console.log('::add-mask::' + url);
            execFileSync('curl', ['--fail', '--location', '--silent', '--show-error', url, '--output', file], { stdio: 'inherit' });
          }
          download(payload.guppy_url, dir + '/guppy-source', 'Guppy');
          download(payload.betta_url, dir + '/betta-source', 'Betta');

          function install(source, stem) {
            const b = fs.readFileSync(source);
            let ext;
            if (b.length > 16 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) ext = 'jpg';
            else if (b.length > 16 && b.toString('ascii', 0, 4) === 'RIFF' && b.toString('ascii', 8, 12) === 'WEBP') ext = 'webp';
            else throw new Error('Formato de imagem não reconhecido: ' + stem);
            const name = stem + '.' + ext;
            fs.writeFileSync('public/' + name, b);
            return name;
          }

          const guppyName = install(dir + '/guppy-source', 'guppy-g2-ai-small');
          const bettaName = install(dir + '/betta-source', 'betta-b3-ai-small');

          const appPath = 'src/App.jsx';
          let app = fs.readFileSync(appPath, 'utf8');
          const oldGuppy = 'guppy-g2-ai-small.jpg';
          const oldBetta = 'betta-b3-ai-small.jpg';
          if (!app.includes(oldGuppy) || !app.includes(oldBetta)) {
            throw new Error('Não encontrei os dois endereços antigos no guia; nenhuma referência foi alterada.');
          }
          app = app.replaceAll(oldGuppy, guppyName);
          app = app.replaceAll(oldBetta, bettaName);
          fs.writeFileSync(appPath, app);
          console.log('Imagens instaladas: ' + guppyName + ' e ' + bettaName);
          NODE

      - name: Registrar a atualização e iniciar as publicações
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .github/image-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza imagens do Guppy e Betta no guia"
          git push origin HEAD:main

          # O GITHUB_TOKEN não dispara workflows por push; iniciamos as duas publicações explicitamente.
          for workflow in build-apk.yml deploy.yml; do
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/andrino0/AquaProFish/actions/workflows/${workflow}/dispatches" \
              --data '{"ref":"main"}'
          done
